name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize locked runtime dependencies without development or peer packages
        run: npm ci --omit=dev --omit=peer --ignore-scripts --prefix capabilities/oas-aweb
      - name: Audit the materialized runtime closure
        run: npm audit --omit=dev --omit=peer --ignore-scripts --prefix capabilities/oas-aweb
      - name: Validate manifests, package-local skills, and hooks
        run: npm test
      - name: Consumer probe status
        run: echo "BLOCKED(engine-m2-fixtures) acquire -> lock -> trust -> activate -> spawn"
