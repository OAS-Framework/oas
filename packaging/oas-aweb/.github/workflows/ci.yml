name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize locked runtime dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate manifests, package-local skills, and hooks
        run: npm test
      - name: Consumer probe status
        run: echo "BLOCKED(engine-fixtures) acquire -> lock -> trust -> activate -> spawn"
